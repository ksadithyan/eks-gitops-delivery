apiVersion: apps/v1
kind: Deployment
metadata:
  name: podinfo
  namespace: production
  labels:
    app: podinfo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: podinfo
  template:
    metadata:
      labels:
        app: podinfo
    spec:
      containers:
      - name: podinfo
        image: ghcr.io/stefanprodan/podinfo:6.5.0
        ports:
        - containerPort: 9898
        env:
        - name: PODINFO_UI_COLOR
          value: "#2563eb"
        - name: PODINFO_UI_MESSAGE
          value: "Hello from PRODUCTION!"
